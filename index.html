<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>MY VOICE ANALYZER v1</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f5f7;color:#171717;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Noto Sans JP",sans-serif}
main{max-width:680px;margin:auto;padding:28px 16px 50px}
h1{font-size:29px;margin:0}.sub{color:#666;margin:6px 0 22px;line-height:1.55}
.card{background:#fff;border-radius:20px;padding:18px;margin:14px 0;box-shadow:0 2px 14px #0000000a}
input{width:100%;font-size:16px;margin:8px 0 14px}
button{width:100%;border:0;border-radius:14px;background:#111;color:#fff;font-size:17px;font-weight:700;padding:15px}
button:disabled{opacity:.4}.filebox{border:2px dashed #bbb;border-radius:14px;padding:17px;text-align:center;margin-bottom:12px}
#status{font-size:14px;color:#666;margin-top:10px;min-height:20px}
.score{text-align:center;font-size:62px;font-weight:800;line-height:1.1}.score span{font-size:20px;color:#777}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metric{background:#f1f1f3;border-radius:14px;padding:13px}
.metric b{float:right;font-size:20px}.metric div{clear:both;height:7px;background:#ddd;border-radius:8px;margin-top:9px}.metric i{display:block;height:100%;background:#111;border-radius:8px}
h2{font-size:19px;margin:0 0 13px}.note{line-height:1.75}.good,.warn{padding:14px;border-radius:14px;line-height:1.65}.good{background:#edf7ed}.warn{background:#fff3df}
canvas{width:100%;height:210px;border:1px solid #eee;border-radius:12px;display:block}
small{color:#777;line-height:1.5}
</style>
</head>
<body>
<main>
<h1>MY VOICE ANALYZER 🎤</h1>
<div class="sub">歌声を「上手い・下手」だけでなく、特に<strong>高音で力んでいないか</strong>まで見る試作アプリ。</div>

<div class="card">
<div class="filebox">① 歌声のファイルを選択</div>
<input id="file" type="file" accept="audio/*,video/*">
<button id="go" disabled>② 分析する</button>
<div id="status">ファイルを選択してください。</div>
</div>

<section id="result" style="display:none">
<div class="card">
<div class="score" id="total">--<span>/100</span></div>
<div style="text-align:center;color:#666">今回の総合評価</div>
</div>

<div class="card">
<h2>歌唱カルテ</h2>
<div class="grid" id="metrics"></div>
</div>

<div class="card">
<h2>ピッチの推移</h2>
<canvas id="graph"></canvas>
<small>声の高さの変化。伴奏や録音環境によって検出が乱れる場合があります。</small>
</div>

<div class="card">
<h2>今回の診断</h2>
<div id="diagnosis" class="note"></div>
</div>

<div class="card">
<h2>次にやること</h2>
<div id="advice" class="note"></div>
</div>
</section>

<div class="card"><small>このVer.1は端末内だけで簡易解析します。DAM精密採点AIと同じ採点ではありません。録音環境・伴奏・エコーの影響を受けます。</small></div>
</main>

<script>
const $=id=>document.getElementById(id);
let selected=null;
$('file').addEventListener('change',()=>{
 selected=$('file').files[0]||null;
 $('status').textContent=selected?`選択済み：${selected.name}`:'ファイルを選択してください。';
 $('go').disabled=!selected;
});
function clamp(x,a,b){return Math.max(a,Math.min(b,x))}
function q(a,p){if(!a.length)return 0;let b=[...a].sort((x,y)=>x-y),i=(b.length-1)*p,l=Math.floor(i),h=Math.ceil(i);return b[l]+(b[h]-b[l])*(i-l)}
function draw(v){
 const c=$('graph'),d=devicePixelRatio||1,w=c.clientWidth*d,h=210*d;c.width=w;c.height=h;
 const ctx=c.getContext('2d');ctx.clearRect(0,0,w,h);
 const a=v.filter(x=>x!==null);if(!a.length)return;
 const lo=q(a,.03)-2,hi=q(a,.97)+2;ctx.beginPath();let on=false;
 v.forEach((x,i)=>{if(x===null){on=false;return}let X=i/(v.length-1)*w,Y=h-(x-lo)/(hi-lo)*h;if(!on)ctx.moveTo(X,Y);else ctx.lineTo(X,Y);on=true});
 ctx.lineWidth=2;ctx.stroke();
}
$('go').addEventListener('click',async()=>{
 if(!selected)return;
 $('go').disabled=true;$('status').textContent='解析中…（動画は少し時間がかかります）';
 try{
  const AC=window.AudioContext||window.webkitAudioContext;if(!AC)throw Error('このブラウザは音声解析に対応していません。');
  const ac=new AC();const raw=await selected.arrayBuffer();
  const audio=await ac.decodeAudioData(raw);const data=audio.getChannelData(0),sr=audio.sampleRate;
  const frame=Math.floor(sr*.035),hop=Math.floor(sr*.02),p=[],r=[];
  // 軽量な自己相関式F0推定
  for(let s=0;s+frame<data.length;s+=hop){
   let e=0;for(let j=0;j<frame;j++)e+=data[s+j]*data[s+j];
   let rms=Math.sqrt(e/frame);r.push(rms);
   if(rms<.01){p.push(null);continue}
   let best=-1,bc=.5,minL=Math.floor(sr/900),maxL=Math.floor(sr/70);
   for(let lag=minL;lag<=maxL;lag++){
    let ab=aa=bb=0;
    for(let j=0;j<frame-lag;j++){let x=data[s+j],y=data[s+j+lag];ab+=x*y;aa+=x*x;bb+=y*y}
    let c=ab/Math.sqrt((aa*bb)||1);if(c>bc){bc=c;best=lag}
   }
   p.push(best>0?69+12*Math.log2((sr/best)/440):null);
  }
  const pv=p.filter(x=>x!==null);if(pv.length<20)throw Error('声を十分に検出できませんでした。');
  const voiced=pv.length/p.length;
  let ds=[];for(let i=1;i<p.length;i++)if(p[i]!=null&&p[i-1]!=null){let d=Math.abs(p[i]-p[i-1]);if(d<6)ds.push(d)}
  const stability=clamp(99-(q(ds,.65)||2)*13,55,96);
  const dyn=clamp(60+(q(r,.9)/(q(r,.15)+.005)-1)*8,58,96);
  const hiCut=q(pv,.75), midLo=q(pv,.35),midHi=q(pv,.6);
  const hm=[],mm=[];p.forEach((x,i)=>{if(x!=null){if(x>=hiCut)hm.push(r[i]);if(x>=midLo&&x<=midHi)mm.push(r[i])}});
  const hr=(hm.reduce((a,b)=>a+b,0)/(hm.length||1))/(mm.reduce((a,b)=>a+b,0)/(mm.length||1)||1);
  const high=clamp(94-Math.max(0,hr-1.05)*42,45,94);
  const pitch=clamp(60+stability*.3+voiced*16,60,96);
  const clarity=clamp(50+voiced*50,50,98);
  const range=q(pv,.95)-q(pv,.05),rangeScore=clamp(55+range*2,55,95);
  const total=Math.round(pitch*.2+stability*.18+dyn*.15+high*.27+clarity*.1+rangeScore*.1);
  const ms=[['音程',pitch],['安定性',stability],['抑揚',dyn],['高音コントロール',high],['明瞭さ',clarity],['音域',rangeScore]];
  $('total').innerHTML=total+'<span>/100</span>';
  $('metrics').innerHTML=ms.map(([n,v])=>`<div class="metric">${n}<b>${Math.round(v)}</b><div><i style="width:${Math.round(v)}%"></i></div></div>`).join('');
  draw(p);
  let d='',a='';
  if(high<70){
   d+=`<div class="warn"><strong>高音で力が入りやすい可能性があります。</strong><br>高い音域で声量が一緒に上がる傾向を検出しました。これは「高音を出せない」というより、<strong>高音を強く出そうとしている</strong>状態の可能性があります。</div>`;
   a+='・高音の1音前から声量を少し落とす<br>・高音を50〜70%の音量で出す練習<br>・「高い＝大きい」ではなく「高い＝軽い」を意識<br>・リップトリル→「woo」→歌詞の順で戻す';
  }else{
   d+=`<div class="good"><strong>高音時の声量コントロールは比較的良好です。</strong><br>高音になっても極端に力む傾向は強くありません。</div>`;
   a+='・今の軽さを維持したまま音域を少しずつ広げる<br>・難しいフレーズだけ小さい声で分解練習';
  }
  d+=`<p>推定有声音率：<strong>${Math.round(voiced*100)}%</strong><br>推定音域幅：約<strong>${range.toFixed(1)}半音</strong></p>`;
  $('diagnosis').innerHTML=d;$('advice').innerHTML=a;
  $('result').style.display='block';$('status').textContent=`分析完了（${audio.duration.toFixed(1)}秒）`;
  await ac.close();
 }catch(e){$('status').textContent='解析できませんでした：'+e.message}
 $('go').disabled=false;
});
</script>
</body></html>
